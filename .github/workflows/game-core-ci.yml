name: Game Core CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: syntax-and-core-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' ! -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
          node --check tests/core-smoke.mjs

      - name: Game core smoke
        run: node tests/core-smoke.mjs

name: Game Core CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: syntax-core-and-browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' ! -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
          node --check tests/core-smoke.mjs
          node --check tests/browser-smoke.mjs

      - name: Game core smoke
        run: npm run test:core

      - name: Install browser smoke dependency
        run: npm install --package-lock=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Gameplay browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/game-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then
              break
            fi
            sleep 0.25
          done

          GAME_URL=http://127.0.0.1:8080 npm run test:browser
